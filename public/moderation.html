# 二次元裏@αimg(あいもげ) モデレーション方針

## 1. 基本方針

- モデレーションは、[利用規約](/rules.html)および本方針を基準として行います。
- 管理側の好き嫌い（感情・思想）による恣意的な排除は行いません。可能な限り、明文化されたルールに基づく機械的な運用を行います。
- 利用規約で禁止された内容は、del 数や人気に関わらず削除対象とします。
- 基本的には、各ユーザーに以下の機能を用いた自衛をお願いします。
    - 単語による NG 機能の活用
    - 画像による NG 機能の活用
    - IDによる NG 機能の活用
    - スレ主によるレス削除機能の活用

- 管理者による削除（管理者 del）は、AI 判定をすり抜けた違反投稿など最小限のみ行います。

## 2. 削除対象となる主な内容

### 1. 中傷・差別・脅迫

- 参加者は互いに敬意を払ってください。
- 特定のトピック(個人、団体、思想、コンテンツ等)への継続的な中傷・攻撃・晒しを禁止します。
- 性別、ジェンダー、身体的・精神的特徴、人種、国籍、宗教等に基づく差別発言を禁止します。
- 差別・敵意・排除を目的とする投稿を禁止します。
- 「冗談」を理由とした差別やハラスメントは容認されません。

### 2. 自傷・他害の助長
- 自傷・自殺・暴力行為を勧める／美化する／具体的に指南する内容は禁止します。

### 3. 著作権・同人・違法行為

#### 3-1. 同人関連アップロード依頼
- 著作権を有しない作品のアップロード依頼は禁止します。
- 引用・レビュー等、著作権法上認められた利用は例外とします。

#### 3-2. 違法行為の助長
- 違法行為の推奨・肯定、具体的手口の指南（例：違法DL、犯罪手法等）は禁止します。
- 「違法だけどバレない」などの助長発言も削除対象です。

#### 3-3. コンテンツのガイドライン違反
- 各コンテンツの改変・譲渡・翻案・貸与・二次使用に関するガイドラインを厳守してください。

### 4. 画像・R18・AI生成物
#### 4-1. 三次画像（実写）
- 肖像権・プライバシー侵害の恐れが高い実写画像は削除対象です。
- 禁止例：
    - 本人の同意なく撮影された実在個人の写真
    - 特定個人を晒す目的の画像
- セーフ例：
    - 風景・動物
    - 報道写真・公人の公開写真を引用範囲で規約内で利用する場合

#### 4-2. 実在未成年・未成年に見える人物（実写系）
- 実在する未成年者、または未成年に見える実在人物（写真・動画・実写風AI）の性的表現は全面禁止です。
- R18 カテゴリの有無に関わらず禁止とします。

#### 4-3. AI画像による「似ている別人」
- 実在個人をモデルにした、または文脈上その人物と推定できる AI 画像で、性的表現・侮辱・中傷を伴うものは禁止します。
- コミュニティ内で「誰かわかるレベル」の似せ方も、通報があれば削除対象になる場合があります。（完全オリキャラが偶然似た場合は問題ありません）

#### 4-4. 派生作品
- スレッドやレス投稿者がその派生作品に拒絶/禁止の意思を示した場合、その派生作品が削除対象となることがあります。

### 5. 金融・投資・ギャンブル
#### 5-1. 暗号資産・投資への誘導
- 禁止：
    - 身元不明な暗号資産・投資案件への URL 誘導
    - 投資グループや DM への勧誘
    - 「必ず儲かる」等の無責任な煽り
    - 詐欺・ポンジスキーム類似の投稿

- 例外：
    - 相場チャート・ブロックチェーンエクスプローラ等、広く知られた閲覧専用サイト
    - 投資を勧誘しないニュース・技術記事の共有
    - 株スレ

#### 5-2. ギャンブル・賭博
- 禁止：
    - 違法オンラインギャンブル（カジノ・ポーカー等）への誘導
    - 違法サイトへの URL
    - 登録・入金手順の指南
    - 「バレないから大丈夫」等の助長発言

- 例外：
    - 公営競技（競馬・競輪・競艇等）の話題
    - 違法行為に結びつかない海外カジノ旅行などの雑談

### 6. アフィリエイト・宣伝・ショッピングURL
#### 6-1. アフィリエイトリンク
- 一般ユーザーによるアフィリエイトID付きURLを用いた収益目的の宣伝は禁止します。
- A8 や短縮 URL を利用したスパム投稿も削除対象になります。

#### 6-2. 通常のショッピングURL
- Amazon・楽天・BOOTH 等へのリンクは、会話の流れでの利用であれば許可します。
- 過度な連投・執拗な宣伝はスパムとして制限します。

#### 6-3. 公式ショップ・サークル等の宣伝
- 管理者が承認した公式アカウントは、自身の販売ページを案内できます（ただしスパム的な勧誘は制限されます）。

### 7. 著しい脱線・嫌がらせ

- スレッドの話題から著しく逸脱し、かつ楽しめる人が限定されるようなレスは、削除対象となることがあります。
- 事例：
    - 生成AIが主題でないスレに、生成AIに関するレスを過剰に行う行為
    - 配信などのスレッドにおいて、合意のないハラスメントを執拗に行う行為
    - 配信や同時視聴などのスレッドにおいて、配信者や配信内容と関係のない話題を執拗にレスする行為
    - 特定コンテンツを引用するいわゆる"語録"を、コンテンツと無関係のスレに執拗に書き込む行為

### 8. del・NG設定と自治行為
#### 8-1. コミュニティのユーザー同士による独自の自治行為の禁止
- 他ユーザーに対し、「規約違反だから出ていって欲しい」「NGした」「delしよう」「delした」など争う行動やそれを誘導する発言を執拗に行う行為を禁止します。
- ルールを口実にした晒し・粘着・人格攻撃を禁止します。
    - ※ ルールや運営への意見は、専用スレッドや問い合わせで冷静に行ってください。

## 3. 管理者によるBAN
- 管理者によってユーザーを BAN (アクセス制限) することがあります。
- BAN を行う際は、恣意的な BAN にならないよう、違反内容と経緯を確認して判断します。
